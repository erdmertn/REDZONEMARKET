<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keylerim ve Sipariş Takibi - RedZone Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#090d16] text-gray-200 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-[#0c1220] border-b border-slate-800 py-4">
    <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 via-red-600 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-600/30">
          <i class="fa-solid fa-gamepad text-white text-base"></i>
        </div>
        <div class="font-heading text-xl font-bold text-white">
          REDZONE<span class="text-rose-500">MARKET</span>
        </div>
      </a>
      <a href="index.html" class="text-xs font-semibold text-gray-400 hover:text-white transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Mağazaya Dön</span>
      </a>
    </div>
  </nav>

  <!-- MAIN LOOKUP -->
  <main class="max-w-4xl mx-auto px-4 py-12 flex-1 w-full">
    
    <div class="text-center max-w-xl mx-auto mb-10">
      <div class="w-14 h-14 rounded-2xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center mx-auto text-2xl mb-4">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="font-heading text-3xl font-bold text-white uppercase tracking-wider">
        Satın Aldığım Keyler
      </h1>
      <p class="text-xs sm:text-sm text-gray-400 mt-2">
        Sipariş verirken kullandığınız e-posta adresinizi girerek satın aldığınız tüm dijital oyun anahtarlarınızı listeleyebilirsiniz.
      </p>

      <!-- Email Search Form -->
      <form id="lookupForm" class="mt-6 flex flex-col sm:flex-row gap-3">
        <input 
          type="email" 
          id="lookupEmail"
          placeholder="Sipariş verdiğiniz e-posta adresi..." 
          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 shadow-inner"
          required
        >
        <button 
          type="submit"
          class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-xs shadow-lg shadow-cyan-500/25 transition active:scale-95 whitespace-nowrap"
        >
          <i class="fa-solid fa-magnifying-glass mr-1.5"></i> Keylerimi Bul
        </button>
      </form>
    </div>

    <!-- Results Section -->
    <div id="resultsContainer" class="space-y-6 hidden">
      <!-- Injected by JS -->
    </div>

    <!-- Empty Result -->
    <div id="emptyResult" class="hidden text-center py-16 bg-slate-900/60 rounded-3xl border border-slate-800">
      <i class="fa-solid fa-inbox text-4xl text-gray-600 mb-3"></i>
      <h3 class="text-base font-bold text-white">Kayıtlı Sipariş Bulunamadı</h3>
      <p class="text-xs text-gray-400 mt-1">Bu e-posta adresine ait tamamlanmış bir key satışı bulunmuyor.</p>
    </div>

  </main>

  <script>
    document.getElementById('lookupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('lookupEmail').value.trim();
      if (!email) return;

      const container = document.getElementById('resultsContainer');
      const emptyBox = document.getElementById('emptyResult');

      container.classList.add('hidden');
      emptyBox.classList.add('hidden');

      try {
        const res = await fetch(`/api/my-keys?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (!data.orders || data.orders.length === 0) {
          emptyBox.classList.remove('hidden');
          return;
        }

        renderCustomerOrders(data.orders);
        container.classList.remove('hidden');
      } catch (err) {
        alert('Sorgulama hatası: ' + err.message);
      }
    });

    function renderCustomerOrders(orders) {
      const container = document.getElementById('resultsContainer');

      container.innerHTML = orders.map(order => `
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
          
          <!-- Order Header -->
          <div class="flex flex-wrap items-center justify-between pb-3 border-b border-slate-800 text-xs">
            <div class="flex items-center gap-3">
              <span class="font-mono font-bold text-cyan-400 text-sm">${order.id}</span>
              <span class="text-gray-400">${new Date(order.createdAt).toLocaleDateString('tr-TR')}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-gray-300 font-bold">${formatCurrency(order.totalAmount)}</span>
              <span class="bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded text-[10px] font-bold border border-emerald-800">
                ${order.paymentStatus}
              </span>
            </div>
          </div>

          <!-- Items -->
          <div class="space-y-4">
            ${order.items.map(item => `
              <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/80">
                <div class="flex items-center justify-between mb-3">
                  <div>
                    <span class="text-[10px] text-cyan-400 font-bold uppercase">${item.platform}</span>
                    <h4 class="text-sm font-bold text-white">${item.productName}</h4>
                  </div>
                  <span class="text-xs text-gray-400 font-medium">${item.quantity} Adet</span>
                </div>

                <!-- Keys list -->
                <div class="space-y-2">
                  ${item.assignedKeys.map(key => `
                    <div class="key-vault-box p-3 rounded-xl flex items-center justify-between gap-3">
                      <div class="font-mono text-sm sm:text-base font-bold text-white tracking-wider select-all">${key}</div>
                      <button onclick="copyKeyText('${key}', this)" class="px-3 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-white font-bold text-xs rounded-lg transition">
                        Kopyala
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

        </div>
      `).join('');
    }

    function copyKeyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerText;
        btn.innerText = 'Kopyalandı!';
        btn.classList.add('bg-emerald-500');
        setTimeout(() => {
          btn.innerText = orig;
          btn.classList.remove('bg-emerald-500');
        }, 1500);
      });
    }

    function formatCurrency(val) {
      return new Intl.NumberFormat('tr-TR', {
        style: 'currency',
        currency: 'TRY',
        minimumFractionDigits: 2
      }).format(val || 0);
    }
  </script>
</body>
</html>
