<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0507" />
      <stop offset="50%" stop-color="#19060b" />
      <stop offset="100%" stop-color="#050203" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff0033" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Cyber Grid Lines -->
  <path d="M0,100 L800,100 M0,200 L800,200 M0,300 L800,300 M0,400 L800,400" stroke="#ff0044" stroke-width="0.5" stroke-opacity="0.15" />
  <path d="M200,0 L200,500 M400,0 L400,500 M600,0 L600,500" stroke="#ff0044" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Hexagon / Shield Badge -->
  <polygon points="400,80 490,130 490,230 400,280 310,230 310,130" fill="#1f070e" stroke="#ff0044" stroke-width="3" filter="url(#glow)" />
  
  <!-- Inner Symbol (Key / Crosshair) -->
  <circle cx="400" cy="170" r="30" fill="none" stroke="#ff3366" stroke-width="4" />
  <line x1="400" y1="125" x2="400" y2="215" stroke="#ff0044" stroke-width="4" />
  <line x1="355" y1="170" x2="445" y2="170" stroke="#ff0044" stroke-width="4" />

  <!-- Title Text -->
  <text x="400" y="350" font-family="'Rajdhani', sans-serif, Arial" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    REDLUA <tspan fill="url(#redGlow)" filter="url(#glow)">LOADER</tspan>
  </text>

  <!-- Subtitle Text -->
  <text x="400" y="390" font-family="'Inter', sans-serif, Arial" font-size="16" font-weight="700" fill="#ff4d79" text-anchor="middle" letter-spacing="8">
    GÜNLÜK • HAFTALIK • AYLIK KEY
  </text>

  <!-- Status Pill -->
  <rect x="300" y="420" width="200" height="30" rx="15" fill="#290710" stroke="#ff0044" stroke-width="1.5" />
  <text x="400" y="440" font-family="'Inter', sans-serif, Arial" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    ⚡ UNDETECTED &amp; BYPASS
  </text>
</svg>
